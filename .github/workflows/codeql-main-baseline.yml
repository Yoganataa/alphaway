name: Temporary CodeQL main baseline diagnostics

on:
  push:
    branches:
      - audit/codeql-main-baseline

permissions:
  contents: read
  security-events: read

jobs:
  analyze:
    name: SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout the current Phase 2 branch for direct SARIF verification
        uses: actions/checkout@v4
        with:
          ref: feat/phase-2-auth-admin-security

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze without uploading alerts
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: never

      - name: Export open CodeQL alerts for the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$(git rev-parse HEAD)" > analyzed-source-head-sha.txt

      - name: Upload default-branch alert inventory
        uses: actions/upload-artifact@v4
        with:
          name: codeql-main-open-alert-inventory-${{ matrix.language }}
          path: |
            codeql-open-alerts.json
            codeql-open-alerts.tsv
            codeql-open-alerts-count.txt
            codeql-open-alerts-error.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload SARIF diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: codeql-main-baseline-${{ matrix.language }}
          path: |
            sarif-results/
            analyzed-source-head-sha.txt
          if-no-files-found: error
          retention-days: 3
