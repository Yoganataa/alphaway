name: Temporary CodeQL main baseline diagnostics

on:
  push:
    branches:
      - audit/codeql-main-baseline

permissions:
  contents: read
  security-events: read

jobs:
  analyze:
    name: SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze without uploading alerts
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: never

      - name: Export open CodeQL alerts for the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" > codeql-open-alerts.json 2> codeql-open-alerts-error.txt; then
            jq '[.[] | select(.tool.name == "CodeQL")] | length' codeql-open-alerts.json > codeql-open-alerts-count.txt
            jq -r '.[] | select(.tool.name == "CodeQL") | [.number, .rule.id, (.rule.security_severity_level // "none"), .most_recent_instance.location.path, .most_recent_instance.location.start_line, .html_url] | @tsv' codeql-open-alerts.json > codeql-open-alerts.tsv
          else
            echo "CodeQL alert API query failed; inspect the error artifact." > codeql-open-alerts-count.txt
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" -f state=open -f pr=4 -f per_page=100 > codeql-feature-open-alerts.json 2> codeql-feature-open-alerts-error.txt; then
            jq '[.[] | select(.tool.name == "CodeQL")] | length' codeql-feature-open-alerts.json > codeql-feature-open-alerts-count.txt
            jq -r '.[] | select(.tool.name == "CodeQL") | [.number, .rule.id, (.rule.security_severity_level // "none"), .most_recent_instance.location.path, .most_recent_instance.location.start_line, .html_url] | @tsv' codeql-feature-open-alerts.json > codeql-feature-open-alerts.tsv
          else
            echo "CodeQL feature branch alert API query failed; inspect the error artifact." > codeql-feature-open-alerts-count.txt
          fi

      - name: Upload default-branch alert inventory
        uses: actions/upload-artifact@v4
        with:
          name: codeql-main-open-alert-inventory-${{ matrix.language }}
          path: |
            codeql-open-alerts.json
            codeql-open-alerts.tsv
            codeql-open-alerts-count.txt
            codeql-open-alerts-error.txt
            codeql-feature-open-alerts.json
            codeql-feature-open-alerts.tsv
            codeql-feature-open-alerts-count.txt
            codeql-feature-open-alerts-error.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload SARIF diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: codeql-main-baseline-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: error
          retention-days: 3
