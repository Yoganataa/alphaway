name: Temporary CodeQL main baseline diagnostics

on:
  push:
    branches:
      - audit/codeql-main-baseline

permissions:
  contents: read

jobs:
  analyze:
    name: SARIF (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze without uploading alerts
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: never

      - name: Upload SARIF diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: codeql-main-baseline-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: error
          retention-days: 3
