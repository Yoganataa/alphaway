name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_gate_drill:
        description: Run the live upstream gate drill (may consume upstream allowance)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3

jobs:
  unit:
    name: Unit and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and integration tests
        run: bun run test:unit
      - name: Verify transport fingerprint
        run: bun run fingerprint:check

  build:
    name: UI and standalone binary build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build dashboard and standalone executable
        run: bun run build
      - name: Verify standalone executable
        run: ./alphaway --version

  e2e:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build dashboard
        run: bun run build:ui
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run dashboard E2E tests
        run: bun run test:e2e

  live-gate-drill:
    name: Optional live upstream gate drill
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_gate_drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run live upstream drill
        run: bun run drill
